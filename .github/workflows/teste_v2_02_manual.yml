"""
TESTE 2 — AGENTE DE TRABALHO V2

Objetivo:
Validar a capacidade do AgenteTrabalho V2 de utilizar a ferramenta
listar_arquivos para identificar os arquivos .py existentes
diretamente na raiz do repositório, evitando solicitar à IA
uma interpretação desnecessariamente ampla da árvore de arquivos.

Registro estrutural de referência: 0110
"""

import json

from agente_trabalho import AgenteTrabalho


def main():
    agente = AgenteTrabalho()

    resultado = agente.executar(
        tarefa=(
            "Use a ferramenta listar_arquivos no diretório raiz '.'. "
            "A ferramenta retorna caminhos de arquivos. Considere "
            "somente os arquivos que estejam diretamente na raiz, "
            "ou seja, caminhos sem '/'. Entre esses arquivos, "
            "considere somente os que terminem em '.py'. "
            "Informe a lista desses arquivos e a quantidade total. "
            "Não é necessário listar nem analisar arquivos de "
            "subdiretórios."
        ),
        criterio_conclusao=(
            "A ferramenta listar_arquivos deve ser utilizada com "
            "o diretório '.'. A resposta final deve considerar "
            "somente arquivos .py diretamente na raiz do "
            "repositório, ignorando arquivos de subdiretórios. "
            "Deve informar os nomes encontrados e a quantidade "
            "total. A resposta não deve inventar arquivos."
        ),
    )

    print(
        json.dumps(
            resultado,
            ensure_ascii=False,
            indent=2,
        )
    )


if __name__ == "__main__":
    main()

name: Rotina Diária de Verificação

on:
  schedule:
    # Roda todos os dias às 06:00 UTC (03:00 no horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo da execução manual (opcional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  verificacao:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install groq requests

      - name: Registrar timestamp de início
        run: |
          echo "## Timestamp de Início" >> $GITHUB_STEP_SUMMARY
          echo "Data/Hora (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "Data/Hora (Brasília): $(TZ='America/Sao_Paulo' date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "Motivo: ${{ inputs.motivo || 'Execução automática (schedule)' }}" >> $GITHUB_STEP_SUMMARY

      - name: Verificar integridade da memória
        id: verificacao
        run: |
          python -c "
          import json
          import os
          import hashlib
          
          caminho = 'memoria.json'
          
          if not os.path.exists(caminho):
              print('ERRO: memoria.json não encontrado.')
              exit(1)
          
          with open(caminho, 'r', encoding='utf-8') as f:
              memoria = json.load(f)
          
          categorias = ['historico', 'aprendizados', 'decisoes', 'conhecimento', 'contexto']
          print('## Estado da Memória')
          print('')
          for cat in categorias:
              if cat in memoria:
                  print(f'- **{cat}**: {len(memoria[cat])} itens')
              else:
                  print(f'- **{cat}**: AUSENTE')
          
          with open(caminho, 'rb') as f:
              hash_arquivo = hashlib.sha256(f.read()).hexdigest()
          print(f'')
          print(f'**Hash SHA-256:** \`{hash_arquivo}\`')
          " >> $GITHUB_STEP_SUMMARY

      - name: Registrar timestamp de fim
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Timestamp de Fim" >> $GITHUB_STEP_SUMMARY
          echo "Data/Hora (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "Data/Hora (Brasília): $(TZ='America/Sao_Paulo' date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY

      - name: Commitar memória atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memoria.json
          git commit -m "chore: rotina diaria - atualiza memoria.json [skip ci]" || echo "Sem alterações na memoria"
          git push

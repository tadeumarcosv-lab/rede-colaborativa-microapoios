name: Conversar com Agente

on:
  workflow_dispatch:
    inputs:
      instrucao:
        description: 'Digite a instrução para o agente'
        required: true
        type: string

jobs:
  executar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install groq

      - name: Executar Tarefa Atual
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INSTRUCAO: ${{ inputs.instrucao }}
        run: |
          python tarefa_atual.py
